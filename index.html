<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>패스프레이즈 비밀번호 생성기</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">
  <main class="w-full max-w-2xl bg-neutral-950 border border-neutral-800 rounded-2xl shadow-2xl p-5 sm:p-8 space-y-6">
    <!-- Header -->
    <header class="border-b border-neutral-800 pb-4">
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">패스프레이즈 비밀번호 생성기</h1>
      <p class="text-xs sm:text-sm text-neutral-400 mt-1">
        Generated locally in your browser only.
      </p>
    </header>

    <!-- Generated Passphrase Display -->
    <section class="space-y-3">
      <div id="koReadingBox" class="bg-black border border-neutral-800 rounded-xl p-4 space-y-1.5">
        <div class="text-xs text-neutral-400">기억용 한국어 패스프레이즈</div>
        <div id="koPhraseOutput" class="text-base sm:text-lg font-semibold text-neutral-200 break-words leading-relaxed">
          생성 중...
        </div>
      </div>

      <div class="relative bg-black border border-neutral-800 rounded-xl p-4 sm:p-5">
        <div class="flex items-center justify-between text-xs text-neutral-400 mb-2">
          <span id="outputTitleLabel">실제 입력용 비밀번호 (두벌식 영타 변환)</span>
          <span id="charLengthLabel" class="mono text-neutral-400">0자</span>
        </div>
        <div id="passphraseOutput" class="mono text-lg sm:text-xl font-semibold text-white break-all leading-relaxed select-all min-h-[2rem]">
          생성 중...
        </div>
      </div>

      <!-- Primary Actions -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <button id="generateBtn" type="button" class="w-full py-3 px-4 rounded-xl bg-white hover:bg-neutral-200 active:bg-neutral-300 text-black font-semibold text-sm sm:text-base transition flex items-center justify-center gap-2 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          새 패스프레이즈 생성
        </button>
        <button id="copyBtn" type="button" class="w-full py-3 px-4 rounded-xl bg-neutral-900 hover:bg-neutral-800 active:bg-neutral-700 text-white font-semibold text-sm sm:text-base border border-neutral-700 transition flex items-center justify-center gap-2 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          클립보드에 복사
        </button>
      </div>
    </section>

    <!-- Options -->
    <section class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
      <div class="space-y-2">
        <label for="wordCountSelect" class="block text-xs font-medium text-neutral-300">단어 개수 (기본 3단어)</label>
        <select id="wordCountSelect" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
          <option value="3" selected>3단어 (기본)</option>
          <option value="4">4단어</option>
          <option value="5">5단어</option>
          <option value="6">6단어 (권장)</option>
          <option value="7">7단어</option>
          <option value="8">8단어</option>
        </select>
      </div>

      <div class="space-y-2">
        <label for="separatorSelect" class="block text-xs font-medium text-neutral-300">단어 구분 기호</label>
        <select id="separatorSelect" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-white">
          <option value="-" selected>하이픈 (-)</option>
          <option value="_">언더바 (_)</option>
          <option value=".">마침표 (.)</option>
          <option value=" ">공백 (Space)</option>
          <option value="">구분 기호 없음</option>
        </select>
      </div>

      <label class="sm:col-span-2 flex items-center justify-between bg-black border border-neutral-800 rounded-lg px-3.5 py-2.5 cursor-pointer">
        <span class="text-sm text-neutral-200">끝에 무작위 숫자·기호 추가</span>
        <input id="suffixToggle" type="checkbox" checked class="w-4 h-4 accent-white cursor-pointer" />
      </label>
    </section>


  </main>

  <!-- Toast -->

    const KO_WORDLIST = KO_BLOB.split(",");
    const SYMBOLS = ["!", "@", "#", "$", "%", "&", "*", "?"];

    // Hangul 2-beolsik QWERTY mapping tables
    const CHO = ['r','R','s','e','E','f','a','q','Q','t','T','d','w','W','c','z','x','v','g'];
    const JUNG = ['k','o','i','O','j','p','u','P','h','hk','ho','hl','y','n','nj','np','nl','b','m','ml','l'];
    const JONG = ['','r','R','rt','s','sw','sg','e','f','fr','fa','fq','ft','fx','fv','fg','a','q','qt','t','T','d','w','c','z','x','v','g'];

    function hangulToQwerty(text) {
      let out = "";
      for (let i = 0; i < text.length; i++) {
        const code = text.charCodeAt(i);
        if (code >= 0xAC00 && code <= 0xD7A3) {
          const sIdx = code - 0xAC00;
          const choIdx = Math.floor(sIdx / (21 * 28));
          const jungIdx = Math.floor((sIdx % (21 * 28)) / 28);
          const jongIdx = sIdx % 28;
          out += CHO[choIdx] + JUNG[jungIdx] + JONG[jongIdx];
        } else {
          out += text[i];
        }
      }
      return out;
    }

    const state = {
      words: [],
      suffix: "",
      wordCount: 3,
      separator: "-",
      addSuffix: true
    };

    function secureRandomInt(max) {
      const array = new Uint32Array(1);
      const limit = Math.floor(0x100000000 / max) * max;
      let val;
      do {
        window.crypto.getRandomValues(array);
        val = array[0];
      } while (val >= limit);
      return val % max;
    }

    function pickRandomWord() {
      const list = KO_WORDLIST;
      return list[secureRandomInt(list.length)];
    }

    function generateSuffix() {
      const num = secureRandomInt(90) + 10;
      const sym = SYMBOLS[secureRandomInt(SYMBOLS.length)];
      return String(num) + sym;
    }

    function buildKoreanDisplayPhrase() {
      let res = state.words.join(state.separator);
      if (state.addSuffix) {
        res += (state.separator ? state.separator : "") + state.suffix;
      }
      return res;
    }

    function buildPasswordOutput() {
      const tokens = state.words.map(hangulToQwerty);
      let res = tokens.join(state.separator);
      if (state.addSuffix) {
        res += (state.separator ? state.separator : "") + state.suffix;
      }
      return res;
    }

    function generateAll() {
      state.words = Array.from({ length: state.wordCount }, () => pickRandomWord());
      state.suffix = generateSuffix();

      render();
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showToast("클립보드에 복사되었습니다!")).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand("copy");
        showToast("클립보드에 복사되었습니다!");
      } catch (e) {
        showToast("복사에 실패했습니다. 직접 선택해 복사해 주세요.");
      }
      document.body.removeChild(ta);
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0");
      }, 2000);
    }

    function render() {
      document.getElementById("koPhraseOutput").textContent = buildKoreanDisplayPhrase();

      const pw = buildPasswordOutput();
      document.getElementById("passphraseOutput").textContent = pw;
      document.getElementById("charLengthLabel").textContent = pw.length + "자";


    }

    document.getElementById("generateBtn").addEventListener("click", generateAll);
    document.getElementById("copyBtn").addEventListener("click", () => copyText(buildPasswordOutput()));
    document.getElementById("wordCountSelect").addEventListener("change", (e) => {
      state.wordCount = Number(e.target.value);
      generateAll();
    });
    document.getElementById("separatorSelect").addEventListener("change", (e) => {
      state.separator = e.target.value;
      render();
    });
    document.getElementById("suffixToggle").addEventListener("change", (e) => {
      state.addSuffix = e.target.checked;
      render();
    });

    generateAll();
  </script>
